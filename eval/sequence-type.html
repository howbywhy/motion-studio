<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sequence Type QA</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.45 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 72em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin: 12px 0 36px; }
      figure { margin: 0; }
      canvas { width: 100%; height: auto; background: #000; display: block; }
      figcaption { margin-top: 6px; color: #888; font-size: 10px; }
      pre { color: #bbb; font-size: 11px; white-space: pre-wrap; }
      pre.sheet { overflow-x: auto; }
      .live { margin: 0 0 36px; padding: 16px; border: 1px solid #222; }
      .live-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 880px; }
      .stage canvas { width: 100%; }
      .stage div { margin-top: 6px; color: #888; letter-spacing: 0.1em; }
      .hud { color: #c8c4b8; background: #111; padding: 10px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
      .bar button { background: #1a1a1e; color: #ddd; border: 1px solid #333; padding: 6px 10px; font: inherit; cursor: pointer; }
      .bar span { color: #666; letter-spacing: 0.08em; margin-right: 4px; }
      .copies { display: grid; gap: 6px; margin-top: 12px; max-width: 480px; }
      .copies label { display: grid; grid-template-columns: 2.5em 1fr; gap: 8px; align-items: start; color: #888; }
      .copies textarea { background: #111; color: #eee; border: 1px solid #333; font: inherit; padding: 6px; min-height: 38px; resize: vertical; }
    </style>
  </head>
  <body>
    <h1>Sequence Type — motion QA</h1>
    <p>Eval only. CONNECTED is the leading direction. Compare arrivals — NEAR-SILENT / SOFT CROP / CURRENT — against the same resolve. Arrival should not announce itself. Resolve 0.72–1.00 stays connected to Bloom.</p>
    <div id="root">Loading Switzer…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runSequenceTypeSheet } from "/src/eval/sequenceType.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      void (async () => {
        try {
          const report = await runSequenceTypeSheet(root);
          window.__SEQUENCE_TYPE__ = report;
          const { details, elapsedMs, ...flags } = report;
          out.textContent = JSON.stringify({ summary: { ...flags, elapsedMs }, details }, null, 2);
        } catch (e) {
          const err = e instanceof Error ? `${e.name}: ${e.message}\n${e.stack ?? ""}` : String(e);
          root.textContent = err;
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
