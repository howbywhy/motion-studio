<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MBM type sheet</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.4 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 52em; }
      .page-row { display: flex; gap: 20px; margin: 0 0 28px; align-items: flex-start; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin: 16px 0 48px; }
      figure { margin: 0; }
      canvas { height: auto; background: #000; display: block; }
      .page-row figure canvas { width: auto; max-height: 420px; }
      .grid canvas { width: 100%; }
      figcaption { margin-top: 6px; color: #888; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="root">Loading Switzer…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runTypeSheet } from "/src/eval/typeSheet.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      try {
        const report = await runTypeSheet(root);
        window.__TYPE_SHEET__ = report;
        out.textContent = JSON.stringify({
          coupling: report.coupling,
          spaceBetween: report.spaceBetween,
          paragraphReadable: report.paragraphReadable,
          styleCeilings: report.styleCeilings,
          overflow: report.overflow,
          exportParity: report.exportParity,
          needType03: report.needType03,
          elapsedMs: report.elapsedMs,
        }, null, 2);
      } catch (e) {
        root.textContent = String(e);
      }
    </script>
  </body>
</html>
