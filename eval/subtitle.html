<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Subtitle</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.4 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 64em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 12px 0 32px; }
      figure { margin: 0; }
      canvas { width: 100%; height: auto; background: #000; display: block; }
      figcaption { margin-top: 6px; color: #888; font-size: 10px; }
      pre { color: #bbb; font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Subtitle</h1>
    <p>Yellow editorial cues. One non-empty line = one cue. Per-state sequencing inside Beat. Hard cuts. Flicker scans the disrupt window.</p>
    <div id="root">Running…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runSubtitleSheet } from "/src/eval/subtitle.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      void (async () => {
        try {
          const report = await runSubtitleSheet(root);
          window.__SUBTITLE__ = report;
          const { details, elapsedMs, ...flags } = report;
          out.textContent = JSON.stringify({ summary: { ...flags, elapsedMs }, details }, null, 2);
        } catch (e) {
          const err = e instanceof Error ? `${e.name}: ${e.message}\n${e.stack ?? ""}` : String(e);
          root.textContent = err;
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
