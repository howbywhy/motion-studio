<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mark identity event</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.4 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 64em; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 12px 0 36px; }
      figure { margin: 0; }
      canvas { width: 100%; height: auto; background: #000; display: block; }
      figcaption { margin-top: 6px; color: #888; font-size: 10px; }
      pre { color: #bbb; font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Mark — identity event</h1>
    <p>MADE BY is the anchor. MADELEN travels in X only: RIGHT → ALIGN → LEFT → ALIGN → RIGHT → SNAP ALIGN → HOLD. Emblem is Interrupt only. Product Flicker is test A (final snap). 12s loop.</p>
    <div id="root">Running…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runMarkSheet } from "/src/eval/mark.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      void (async () => {
        try {
          const report = await runMarkSheet(root);
          window.__MARK__ = report;
          const { details, elapsedMs, ...flags } = report;
          out.textContent = JSON.stringify({ summary: { ...flags, elapsedMs }, details }, null, 2);
        } catch (e) {
          const err = e instanceof Error ? `${e.name}: ${e.message}\n${e.stack ?? ""}` : String(e);
          root.textContent = err;
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
