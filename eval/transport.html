<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transport clock</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.4 ui-monospace, monospace; }
      h1 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 64em; }
      pre { color: #bbb; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Transport clock</h1>
    <p>Pause All freezes master phase. Resume continues from that phase. Hidden time never enters playback elapsed.</p>
    <div id="root">Running…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runTransportSheet } from "/src/eval/transport.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      void (async () => {
        try {
          const report = await runTransportSheet(root);
          window.__TRANSPORT__ = report;
          const { details, elapsedMs, ...flags } = report;
          out.textContent = JSON.stringify({ summary: { ...flags, elapsedMs }, details }, null, 2);
        } catch (e) {
          const err = e instanceof Error ? `${e.name}: ${e.message}\n${e.stack ?? ""}` : String(e);
          root.textContent = err;
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
