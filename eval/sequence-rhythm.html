<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sequence Rhythm QA</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.45 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 72em; }
      pre { color: #bbb; font-size: 11px; white-space: pre-wrap; }
      pre.sheet { overflow-x: auto; }
      .live { margin: 0 0 36px; padding: 16px; border: 1px solid #222; }
      .stage { max-width: 360px; }
      .stage canvas { width: 100%; height: auto; background: #000; display: block; }
      .hud { color: #c8c4b8; background: #111; padding: 10px; max-width: 420px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
      .bar button { background: #1a1a1e; color: #ddd; border: 1px solid #333; padding: 6px 10px; font: inherit; cursor: pointer; }
      .bar span { color: #666; letter-spacing: 0.08em; margin-right: 4px; }
      .strip-host { margin: 16px 0; max-width: 640px; }
      .sequence-rhythm-strip { display: flex; align-items: flex-end; gap: 8px; width: 100%; }
      .sequence-rhythm-rail {
        position: relative;
        display: flex;
        align-items: flex-end;
        flex: 1 1 auto;
        min-width: 0;
        height: 78px;
        gap: 0;
      }
      .sequence-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 2px 5px;
        background: transparent;
        border: 1px solid transparent;
        color: #888;
        cursor: pointer;
        min-width: 28px;
        overflow: hidden;
      }
      .sequence-cell.is-selected { border-color: #eee; color: #eee; }
      .sequence-cell.is-active::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 3px;
        height: 3px;
        background: #eee;
        border-radius: 50%;
        transform: translate(-50%, -2px);
      }
      .sequence-cell.is-drop { border-color: #666; }
      .sequence-cell-index { font-size: 8px; letter-spacing: 0.12em; }
      .sequence-cell-time { font-size: 8px; letter-spacing: 0.04em; color: #bbb; }
      .sequence-cell-thumb { width: 100%; height: 45px; display: block; background: #111; }
      .sequence-cell-tag { font-size: 7px; letter-spacing: 0.1em; color: #888; }
      .sequence-rhythm-handle {
        position: absolute;
        bottom: 16px;
        z-index: 2;
        width: 10px;
        height: 45px;
        margin-left: -5px;
        padding: 0;
        border: none;
        background: transparent;
        cursor: ew-resize;
      }
      .sequence-rhythm-handle::after {
        content: "";
        display: block;
        width: 1px;
        height: 100%;
        margin: 0 auto;
        background: #3a3a42;
      }
      .sequence-rhythm-handle:hover::after,
      .sequence-rhythm-handle:focus::after { width: 2px; background: #eee; }
      .sequence-rhythm-tools { display: flex; flex-direction: column; gap: 6px; align-items: center; }
      .sequence-add {
        width: 36px;
        height: 45px;
        border: 1px solid #333;
        background: transparent;
        color: #888;
        cursor: pointer;
      }
      .sequence-rhythm-reset {
        background: transparent;
        color: #888;
        border: none;
        font: inherit;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .type-slots { display: flex; flex-direction: column; gap: 4px; max-width: 420px; margin-top: 12px; }
      .type-slot { display: flex; gap: 8px; color: #666; border-left: 2px solid transparent; padding: 2px 6px; }
      .type-slot.is-active { color: #eee; border-left-color: #eee; }
    </style>
  </head>
  <body>
    <h1>Sequence Rhythm — eval</h1>
    <p>Order + duration. Master length stays 8s / 12s. The strip is a rhythm editor, not a timeline. Product Loop timing is unchanged.</p>
    <div id="root">Loading Switzer…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runSequenceRhythmSheet } from "/src/eval/sequenceRhythm.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      void (async () => {
        try {
          const report = await runSequenceRhythmSheet(root);
          window.__SEQUENCE_RHYTHM__ = report;
          const { details, elapsedMs, ...flags } = report;
          out.textContent = JSON.stringify({ summary: { ...flags, elapsedMs }, details }, null, 2);
        } catch (e) {
          const err = e instanceof Error ? `${e.name}: ${e.message}\n${e.stack ?? ""}` : String(e);
          root.textContent = err;
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
