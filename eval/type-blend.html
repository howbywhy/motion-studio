<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MBM type blend</title>
    <style>
      body { margin: 24px; background: #0c0c0e; color: #eee; font: 12px/1.4 ui-monospace, monospace; }
      h1, h2 { font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
      p { color: #888; max-width: 52em; }
      .page-row { display: flex; gap: 16px; margin: 0 0 28px; align-items: flex-start; flex-wrap: wrap; }
      figure { margin: 0; }
      canvas { height: auto; max-height: 360px; background: #000; display: block; }
      figcaption { margin-top: 6px; color: #888; font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="root">Loading Switzer…</div>
    <pre id="out"></pre>
    <script type="module">
      import { runTypeBlend } from "/src/eval/typeBlend.ts";
      const root = document.getElementById("root");
      const out = document.getElementById("out");
      try {
        const report = await runTypeBlend(root);
        window.__TYPE_BLEND__ = report;
        out.textContent = JSON.stringify({
          geometryUnchangedByBlend: report.geometryUnchangedByBlend,
          normalDeterministic: report.normalDeterministic,
          previewExportMatch: report.previewExportMatch,
          elapsedMs: report.elapsedMs,
        }, null, 2);
      } catch (e) {
        root.textContent = String(e);
      }
    </script>
  </body>
</html>
